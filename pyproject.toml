[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prompton-sdk"
version = "0.2.0"
description = "PromptOn SDK for Python - fetch your pinned prompt, model and params, call the provider yourself, send monitoring logs back."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Polimo" }]
keywords = ["prompton", "llm", "prompt", "prompt-management", "observability"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/polimo-dev/prompton-python"
Source = "https://github.com/polimo-dev/prompton-python"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
prompton-use-cases = "prompton.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/prompton"]

[tool.hatch.build.targets.sdist]
include = ["src/prompton", "tests", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error", "ignore::pytest.PytestUnraisableExceptionWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF", "BLE"]
ignore = ["B008", "SIM108", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
